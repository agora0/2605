<p>　　【共同社华盛顿5月1日电】美国财政部发言人4月30日就日本政府与央行实施买进日元并卖出美元的干预汇市措施发表评论称，“正在继续与日本财务省密切沟通”。美财政部长贝森特1月在华盛顿与来访的日财务相片山皋月会谈之际，曾提及“不希望汇率过度波动”。</p>
