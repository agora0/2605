<p>　　【共同社5月24日电】日本首相高市早苗23日在社交平台X（原推特）上发帖，就中国山西省导致多人死亡的煤矿爆炸事故表示哀悼和慰问。</p>
<p>　　日本政府当天宣布，高市已向中方对遇难者及其家属表示哀悼，并向受灾民众致以慰问。</p>
