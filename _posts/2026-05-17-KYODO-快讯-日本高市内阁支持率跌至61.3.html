<p>　　【共同社5月17日电】日本共同社16日和17日实施的全国电话舆论调查显示，高市内阁的支持率为61.3%，较上次4月调查下跌了2.5个百分点。不支持率为26.8%，较上次上升了0.8个百分点。</p>
