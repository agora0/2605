<p>（中央社記者張雄風台北4日電）中央氣象署今天下午發布大雨特報，對流雲系發展旺盛，易有短延時強降雨，高雄及屏東山區防局部大雨發生，注意雷擊、強陣風、坍方、落石及溪水暴漲；預估大雨持續至晚間。</p><p>大雨地區為高雄市山區、屏東縣山區。（編輯：張雅淨）1150504</p>
