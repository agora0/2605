    <p>　　【共同社5月25日电】据东京警视厅透露，关于东京都中央区银座商业设施“GINZA SIX”出现刺激性气味，在接到报警前，曾有男子在附近喷洒喷雾。据信该男子已离开现场，警方认为他了解相关情况，正在追查下落。</p>
