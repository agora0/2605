    <p>　　【共同社伦敦5月10日电】世界乒乓球团体锦标赛9日在伦敦举行半决赛，日本男团以3比0战胜中华台北，自2016年以来再次闯进决赛。决赛将于10日进行，对手是以3比1战胜法国的中国队。</p>
