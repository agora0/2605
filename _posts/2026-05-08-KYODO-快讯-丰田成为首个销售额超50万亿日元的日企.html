<p>　　【共同社5月8日电】丰田汽车公司8日发布的2025财年（2025年4月至2026年3月）合并财报显示，销售额较上财年增长5.5%，达到50.6849万亿日元，成为首个销售额超50万亿日元的日企。净利润则减少19.2%至3.848万亿日元。</p>
