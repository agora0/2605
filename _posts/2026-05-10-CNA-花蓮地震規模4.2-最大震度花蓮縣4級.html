<p>（中央社台北11日電）根據中央氣象署最新資訊，今天0時59分發生芮氏規模4.2地震，地震深度19.3公里，震央位在花蓮縣政府西南方36.2公里（位在花蓮縣萬榮鄉），最大震度花蓮縣4級。（編輯：何宏儒）1150511</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/17384/">#萬榮鄉</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/25961/">#花蓮縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/25966/">#花蓮縣政府</a></div></div>
