<p>　　【共同社5月28日电】丰田汽车公司28日公布的数据显示，4月从日本出口至中东的汽车数量为2418辆，较上年同期大减91.7%。据分析，中东局势紧张造成了影响。这是连续两个月同比下滑。</p>
