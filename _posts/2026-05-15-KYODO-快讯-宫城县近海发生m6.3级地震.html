<p>　　【共同社5月15日电】日本气象厅消息称，15日晚上8点22分前后，宫城县北部、中部观测到震度5弱（日本标准）的地震。震源位于宫城县近海，震源深度约为50千米，推测震级为M6.3级。无需担心引发海啸。</p>
