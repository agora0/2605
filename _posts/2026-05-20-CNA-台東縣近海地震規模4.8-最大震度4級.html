                      </picture><figcaption class="picinfo">台東近海20日晚間8時25分發生規模4.8地震。（圖取自facebook.com/cwa.seismology）</figcaption></figure><p>（中央社台北20日電）根據中央氣象署最新資訊，今天晚間8時25分發生芮氏規模4.8地震，地震深度27.3公里，震央位於台東縣政府北北東方63.9公里（位於台東縣近海），最大震度台東縣4級。（編輯：李淑華）1150520</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4514/">#台東縣</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/4516/">#台東縣政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/38044/">#中央氣象署</a></div></div>
