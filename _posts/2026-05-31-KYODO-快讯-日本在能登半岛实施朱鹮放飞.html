<p>　　【共同社5月31日电】31日在位于日本能登半岛的石川县羽咋市，实施了国家特别天然纪念物朱鹮在本州岛的首次放飞。野生朱鹮因滥捕在日本已经灭绝。在本州岛，这是在能登捕获最后一只朱鹮的1970年以来，时隔56年回归野外。</p>
