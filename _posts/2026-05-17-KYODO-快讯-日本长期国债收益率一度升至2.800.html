<p>　　【共同社5月18日电】日本国债市场18日迎来新的一周，作为长期利率指标的新发10年期国债（第382期、票面利率2.4%）收益率上升，一度达到2.800%。日本相互证券称，这是1997年5月以来约29年的高位。</p>
