<p>　　【共同社马尼拉5月5日电】日本防卫相小泉进次郎5日在菲律宾首都马尼拉与该国国防部长特奥多罗举行会谈。双方同意为向菲律宾出口日本海上自卫队二手护卫舰而新设工作磋商机制。此外可能商定扩大防卫合作。</p>
