<p>　　【共同社5月27日电】27日获悉，对于日本栃木县上三川町抢劫杀人案中疑似主导作案的40多岁男子，栃木县警方以涉嫌抢劫杀人为由取得逮捕证。该男子在案发后出境前往海外。</p>
