<p>　　【共同社5月7日电】黄金周长假结束后7日的东京股市日经指数终盘收于62833.84点，较前一交易日上涨3320.72点。收盘价首次站上62000点关口，涨幅超过以往最高纪录2024年8月6日的3217.04点。</p>
