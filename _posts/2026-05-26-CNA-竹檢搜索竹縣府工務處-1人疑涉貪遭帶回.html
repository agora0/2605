<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0135/">郭宣彣</a>新竹縣26日電）新竹地檢署今天前往新竹縣政府搜索，並帶回1名工務處承辦人員，疑涉貪污案件。對此，檢方表示，因偵查不公開，無法回應；縣府說，相關細節不便說明，全力配合調查。（編輯：李錫璋）1150526</p><div class="articlekeywordGroup"><div class="keywordTag"><a href="https://www.cna.com.tw/tag/3964/">#工務處</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/17048/">#新竹縣政府</a></div><div class="keywordTag"><a href="https://www.cna.com.tw/tag/32814/">#新竹地檢署</a></div></div>
