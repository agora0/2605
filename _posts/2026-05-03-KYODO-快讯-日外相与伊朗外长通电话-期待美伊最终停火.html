<p>　　【共同社内罗毕5月3日电】日本外相茂木敏充2日在外访地肯尼亚与伊朗外长阿拉格齐通电话，表示强烈期待尽快重启与美国的磋商并达成最终协议。据日本外务省称，该会谈是应伊方要求。</p>
