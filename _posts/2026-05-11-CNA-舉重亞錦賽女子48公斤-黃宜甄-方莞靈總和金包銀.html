<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0065/">黎建忠</a>台北11日電）在印度舉行的亞洲舉重錦標賽，今天登場的女子48公斤A級賽事，台灣好手黃宜甄靠著抓舉81公斤、挺舉112公斤、總和193公斤拿下2金1銀；方莞靈則以總和192公斤獲得1金2銀。（編輯：李錫璋）1150511</p>
