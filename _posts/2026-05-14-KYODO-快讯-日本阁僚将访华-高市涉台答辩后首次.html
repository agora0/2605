<p>　　【共同社5月14日电】日本内阁府14日宣布，男女共同参画担当相黄川田仁志将于14日至15日访问中国，出席亚太经合组织（APEC）部长级会议。这将是首相高市早苗涉台国会答辩之后的首次内阁成员访华。</p>
