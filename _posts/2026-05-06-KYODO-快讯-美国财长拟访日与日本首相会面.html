<p>　　【共同社华盛顿5月6日电】6日获悉，美国财政部长贝森特拟于11日至13日访日并与日本首相高市早苗会面，正在为此展开协调。预计他还将与日本财务相片山皋月等人举行会谈。汇率问题以及中国对日出口管制或将成为议题。</p>
