<p>　　【共同社5月18日电】面向修改3份安全保障相关文件的日本自民党提议草案全貌18日曝光。草案写明了建议尽早部署旨在强化防空体系的拦截型无人机，还要求确保至少以年为单位的持续作战能力。</p>
