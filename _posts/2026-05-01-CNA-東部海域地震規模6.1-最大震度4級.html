                      </picture><figcaption class="picinfo">台灣東北部外海1日晚間8時39分發生規模6.1地震。（圖取自氣象署網頁cwa.gov.tw）</figcaption></figure><p>（中央社台北1日電）根據中央氣象署最新資訊，今天晚間8時39分發生芮氏規模6.1地震，地震深度98.3公里，震央位於宜蘭縣政府東北東方38.7公里（位於台灣東部海域），最大震度宜蘭縣、新竹縣、南投縣、花蓮縣4級。（編輯：謝雅竹）1150501</p>
