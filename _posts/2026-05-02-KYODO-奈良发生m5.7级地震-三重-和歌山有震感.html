<p>　　【共同社5月2日电】2日傍晚6点28分左右，日本三重县、奈良县、和歌山县观测到震度4（日本标准）的地震。气象厅消息称，震源位于奈良县，震源深度约70千米。推测震级为M5.7级。</p>
