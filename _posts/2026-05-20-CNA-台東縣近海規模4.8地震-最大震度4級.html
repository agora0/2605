                      </picture><figcaption class="picinfo">台東縣20日9時11分發生芮氏規模4.8地震。（圖取自氣象署網頁cwa.gov.tw）</figcaption></figure><p>（中央社台北20日電）根據中央氣象署最新資訊，20日9時11分發生芮氏規模4.8地震，地震深度27.8公里，震央位於台東縣政府北北東方65.3公里(位於台東縣近海)，最大震度台東縣4級。（編輯：李亨山）1150520</p>
