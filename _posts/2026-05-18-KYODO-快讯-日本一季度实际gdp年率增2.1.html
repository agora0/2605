<p>　　【共同社5月19日电】日本内阁府19日公布的2026年一季度（1至3月）国内生产总值（GDP）初值显示，剔除物价变动因素后的实际GDP较上季度增长0.5%，换算成年率为增长2.1%。这是连续两个季度呈现正增长。</p>
