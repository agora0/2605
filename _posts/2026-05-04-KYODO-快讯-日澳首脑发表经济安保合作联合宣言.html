<p>　　【共同社堪培拉5月4日电】日本首相高市早苗与澳大利亚总理阿尔巴尼斯4日在堪培拉举行会谈，发表了经济安全保障相关联合宣言，主要内容是就能源、关键矿产、粮食等重要物资的稳定供应展开合作。</p>
