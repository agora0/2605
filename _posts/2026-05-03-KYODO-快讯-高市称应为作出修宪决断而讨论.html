<p>　　【共同社5月3日电】日本首相高市早苗（自民党总裁）3日向修宪派集会发送寄语，指出“不能为了讨论而讨论，应该是为作出决断而讨论”，称“正因为《宪法》是国家基础，才应该配合时代的要求而定期更新”。</p>
