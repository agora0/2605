<p>　　【共同社5月8日电】8日获悉，日本政府基本决定5月下旬派遣经济访问团赴俄罗斯。政府向三井物产、商船三井等参加企业就26至27日的日程征询了意向。多名相关人士透露了这一消息。</p>
