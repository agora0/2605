<p>　　【共同社新加坡5月31日电】日本防卫相小泉进次郎31日与菲律宾防长特奥多罗举行会谈，基本同意为了海上自卫队老旧护卫舰的迅速出口与在2027年度内出口1架教练机而推进讨论。</p>
