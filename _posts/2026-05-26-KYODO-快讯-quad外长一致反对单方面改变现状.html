<p>　　【共同社新德里5月26日电】日本外相茂木敏充在Quad外长会议后的联合记者会上表示，“与会方一致同意强烈反对试图凭实力单方面改变现状的行为”。各方还共同对关键矿产的出口管制深表关切。</p>
