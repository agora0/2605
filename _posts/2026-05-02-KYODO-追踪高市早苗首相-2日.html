<p>在越南河内的总理府出席欢迎仪式。与政府总理黎明兴举行首脑会谈小范围会议。举行扩大会议。出席换文仪式及联合记者会。</p>
<p></p>
<p>在国家主席府与越共中央总书记兼国家主席苏林举行会谈，并出席午餐会。在越南国家大学河内校区发表有关外交政策的演讲。</p>
