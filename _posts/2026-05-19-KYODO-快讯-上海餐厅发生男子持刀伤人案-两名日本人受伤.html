<p>　　【共同社上海5月19日电】据中国上海市警方等的消息，该市的日本料理店内19日有男子持水果刀伤人，导致三人受伤。日本外务省相关人士透露，三名伤者中有两人是日本人，不清楚伤势如何。</p>
