<p>（中央社記者<a class="author" href="https://www.cna.com.tw/author/0098/">盧太城</a>台東縣16日電）台東客輪業者今天公告，因海象不佳，明 （17）日凱旋9號客輪從屏東後壁湖往蘭嶼時間調整為上午10時開航；蘭嶼回後壁湖時間為中午12時開航。（編輯：李亨山）1150516</p>
