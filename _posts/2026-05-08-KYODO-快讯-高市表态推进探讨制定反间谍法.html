<p>　　【共同社5月8日电】日本首相高市早苗8日在参院全体会议上就制定《反间谍法》表示：“针对我国的外国情报机构的各种活动正活跃进行。完善防止不正当干涉的机制是当务之急。”她表达了推进探讨的想法。</p>
